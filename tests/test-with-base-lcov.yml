name: Test code coverage with base lcov comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create head and base lcov files
        run: |
          mkdir -p coverage

          # Head coverage: 3 out of 4 lines covered = 75%
          cat > coverage/lcov.info << 'EOF'
          TN:
          SF:src/index.js
          FN:1,main
          FNDA:1,main
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,1
          DA:4,0
          LF:4
          LH:3
          BRF:0
          BRH:0
          end_of_record
          EOF

          # Base coverage: 2 out of 4 lines covered = 50%
          cat > coverage/base-lcov.info << 'EOF'
          TN:
          SF:src/index.js
          FN:1,main
          FNDA:1,main
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,0
          DA:4,0
          LF:4
          LH:2
          BRF:0
          BRH:0
          end_of_record
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          lcov-file: ./coverage/lcov.info
          base-lcov-file: ./coverage/base-lcov.info
          send-summary-comment: "false"
          show-annotations: ""

      - name: Assert percentage output is set
        env:
          PERCENTAGE: ${{ steps.action.outputs.percentage }}
        run: |
          echo "percentage: $PERCENTAGE"
          if [ -z "$PERCENTAGE" ]; then
            echo "FAIL: percentage output is empty"
            exit 1
          fi
          echo "PASS: percentage is '$PERCENTAGE'"

      - name: Assert diff output is positive (head > base)
        env:
          DIFF: ${{ steps.action.outputs.diff }}
        run: |
          echo "diff: $DIFF"
          if [ -z "$DIFF" ]; then
            echo "FAIL: diff output is empty"
            exit 1
          fi
          # diff should be positive since head (75%) > base (50%)
          # Use awk to check numeric value > 0
          IS_POSITIVE=$(echo "$DIFF" | awk '{print ($1 > 0) ? "yes" : "no"}')
          echo "is_positive: $IS_POSITIVE"
          if [ "$IS_POSITIVE" != "yes" ]; then
            echo "FAIL: expected diff to be positive (head coverage > base coverage), got '$DIFF'"
            exit 1
          fi
          echo "PASS: diff is positive '$DIFF'"
