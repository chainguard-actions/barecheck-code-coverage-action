name: Test with barecheck-github-app-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create lcov file with 100% coverage
        run: |
          mkdir -p coverage
          cat > coverage/lcov.info << 'EOF'
          TN:
          SF:src/index.js
          FN:1,main
          FNDA:1,main
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,1
          LF:3
          LH:3
          BRF:0
          BRH:0
          end_of_record
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          barecheck-github-app-token: "test-app-token-value"
          lcov-file: ./coverage/lcov.info
          send-summary-comment: "false"
          show-annotations: ""

      - name: Assert action ran (with barecheck-github-app-token input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PERCENTAGE: ${{ steps.action.outputs.percentage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "percentage: $PERCENTAGE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PERCENTAGE" ]; then
              echo "FAIL: action succeeded but percentage output is empty"
              exit 1
            fi
            echo "PASS: got percentage '$PERCENTAGE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or invalid app token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
